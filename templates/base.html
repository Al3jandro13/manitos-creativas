<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manitos Creativas — Plataforma educativa para preescolar con actividades artísticas, juegos y aprendizaje lúdico.">
  <title>{% block title %}Manitos Creativas{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;500;600;700;800&family=Indie+Flower&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}

  <link rel="icon" href="{% static 'images/logo.png' %}">
</head>
<body>

<!-- Page Loader -->
<div id="page-loader">
  <div class="loader-icon">
    <img src="{% static 'images/logo.png' %}" alt="Manitos Creativas" class="loader-logo">
  </div>
  <div class="loader-dots">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Accessibility Button -->
<button id="a11y-btn" aria-label="Panel de accesibilidad">
  <i class="bi bi-universal-access"></i>
</button>

<!-- Accessibility Panel -->
<div id="a11y-panel" role="dialog" aria-label="Opciones de accesibilidad">
  <div class="a11y-title">
    <i class="bi bi-universal-access"></i> Accesibilidad
  </div>
  <div class="a11y-grid">
    <button class="a11y-item" data-a11y="large-text">
      <span class="icon"><i class="bi bi-text-increase"></i></span>Texto grande
    </button>
    <button class="a11y-item" data-a11y="small-text">
      <span class="icon"><i class="bi bi-text-decrease"></i></span>Texto pequeño
    </button>
    <button class="a11y-item" data-a11y="grayscale">
      <span class="icon"><i class="bi bi-circle-half"></i></span>Escala de grises
    </button>
    <button class="a11y-item" data-a11y="contrast">
      <span class="icon"><i class="bi bi-brightness-high-fill"></i></span>Alto contraste
    </button>
    <button class="a11y-item" data-a11y="neg-contrast">
      <span class="icon"><i class="bi bi-moon-fill"></i></span>Contraste negativo
    </button>
    <button class="a11y-item" data-a11y="light-bg">
      <span class="icon"><i class="bi bi-sun-fill"></i></span>Fondo claro
    </button>
    <button class="a11y-item" data-a11y="underline-links">
      <span class="icon"><i class="bi bi-link-45deg"></i></span>Subrayar links
    </button>
    <button class="a11y-item" data-a11y="readable-font">
      <span class="icon"><i class="bi bi-type"></i></span>Fuente legible
    </button>
  </div>
  <button class="a11y-reset" id="a11y-reset">
    <i class="bi bi-arrow-counterclockwise"></i> Restaurar todo
  </button>
</div>

<div id="content-wrapper">
{% block body_content %}{% endblock %}
</div>

{% if messages %}
<script>
  window.__djangoMessages = [
    {% for message in messages %}
    { text: "{{ message|escapejs }}", tags: "{{ message.tags }}" }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ];
</script>
{% endif %}

<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
